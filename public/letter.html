<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project idea approval | IdeaForge-X</title>
<style>
:root{--ink:#14213d;--mu:#5b6b82;--paper:#eef2f7;--line:#c9d3e0;--blue:#2457ff;--build:#0f8a5f}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding:20px 12px 48px}
.bar{max-width:760px;margin:0 auto 14px;display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.bar a{color:var(--blue)}
button{font:inherit;font-weight:600;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
.sheet{max-width:760px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:6px;padding:44px 48px}
@media (max-width:600px){.sheet{padding:24px 18px}}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:20px}
.brand{font:700 20px Georgia,serif}.brand b{color:var(--blue)}
.ref{text-align:right;font-size:13px;color:var(--mu)}.ref b{display:block;font:700 18px Consolas,"Courier New",monospace;color:var(--ink);letter-spacing:.08em}
h1{font:700 28px/1.2 Georgia,serif;margin:0 0 4px}
.sub{color:var(--mu);margin:0 0 22px}
dl{display:grid;grid-template-columns:170px 1fr;gap:0;margin:0}
dt{font-weight:600;color:var(--mu);padding:9px 12px 9px 0;border-top:1px solid var(--line)}
dd{margin:0;padding:9px 0;border-top:1px solid var(--line)}
@media (max-width:600px){dl{grid-template-columns:1fr}dt{border:0;padding-bottom:0}dd{border-top:0}}
.stamp{display:inline-block;border:3px solid var(--build);color:var(--build);font:700 22px Georgia,serif;letter-spacing:.12em;padding:4px 16px;border-radius:6px;transform:rotate(-3deg);margin:20px 0 6px}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:46px}
.sign div{border-top:1px solid var(--ink);padding-top:6px;font-size:14px;color:var(--mu)}
.note{font-size:12px;color:var(--mu);margin-top:26px;border-top:1px solid var(--line);padding-top:10px}
.err{max-width:760px;margin:40px auto;background:#fff;border-left:4px solid #b83232;padding:16px;border-radius:6px}
@media print{body{background:#fff;padding:0}.bar{display:none}.sheet{border:0;padding:0}}
</style>
</head>
<body>
<div class="bar"><a href="/">Back to home</a><button type="button" id="print">Print or save as PDF</button></div>
<main id="out"><p class="err">Loading the letter...</p></main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML}
var id=new URLSearchParams(location.search).get("id")||"";
$("print").onclick=function(){window.print()};
fetch("/api/letter/"+encodeURIComponent(id)).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||"Could not open the letter");return d})}).then(function(d){
  var members=d.members.map(function(m){return esc(m.name)+(m.roll?" ("+esc(m.roll)+")":"")}).join("<br>");
  var date=new Date(d.approvedAt).toLocaleDateString([], {day:"numeric",month:"long",year:"numeric"});
  var v=d.verdict==="BUILD"?"Build it":d.verdict==="CHANGE IT"?"Change it first":"Don't build";
  $("out").innerHTML='<article class="sheet"><div class="head"><div class="brand">Idea<b>Forge</b>-X</div><div class="ref">Reference<b>'+esc(d.ref)+'</b></div></div>'
   +'<h1>Project idea approval</h1><p class="sub">This idea was approved by the teacher named below.</p>'
   +'<dl>'+(d.team?'<dt>Team</dt><dd>'+esc(d.team)+'</dd>':'')+'<dt>'+(d.members.length>1?'Members':'Student')+'</dt><dd>'+members+'</dd>'
   +(d.className?'<dt>Class</dt><dd>'+esc(d.className)+'</dd>':'')
   +'<dt>Project idea</dt><dd><b>'+esc(d.idea)+'</b></dd>'
   +(d.tech?'<dt>Technologies</dt><dd>'+esc(d.tech)+'</dd>':'')
   +'<dt>Approved by</dt><dd>'+esc(d.teacher)+'</dd><dt>Date approved</dt><dd>'+esc(date)+(d.round>1?' (round '+esc(d.round)+')':'')+'</dd>'
   +'<dt>Originality check</dt><dd>About '+esc(Math.round(Number(d.originality)||0))+'% originality. Checker result: '+esc(v)+'. Difficulty: '+esc(d.difficulty||"")+'.</dd>'
   +(d.comment?'<dt>Teacher comment</dt><dd>'+esc(d.comment)+'</dd>':'')+'</dl>'
   +'<div class="stamp">APPROVED</div>'
   +'<div class="sign"><div>Teacher signature</div><div>Date</div></div>'
   +'<p class="note">Made by IdeaForge-X. The originality figure is an estimate from searches of research papers and GitHub. It is not a plagiarism check and does not replace the teacher\'s judgement.</p></article>';
  document.title="Approval letter "+d.ref;
}).catch(function(e){$("out").innerHTML='<p class="err">'+esc(e.message)+'</p>';$("print").hidden=true});
})();
</script>
</body>
</html>
