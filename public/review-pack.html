<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project workspace | IdeaForge-X</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#14213d;font:16px/1.55 system-ui,Segoe UI,sans-serif}header{position:sticky;top:0;background:#0f1b3d;color:white;padding:12px 5vw;display:flex;justify-content:space-between;align-items:center;gap:12px}button{font:inherit;padding:9px 13px;border:1px solid #b8c5dd;border-radius:8px;background:#fff;color:#2457ff;cursor:pointer}button.primary{background:#2457ff;color:#fff;border:0}main{max-width:1000px;margin:28px auto;padding:0 18px}.card{background:white;border:1px solid #d5dde8;border-radius:12px;padding:24px;margin:14px 0}.slide{min-height:420px;display:flex;flex-direction:column;justify-content:center;padding:48px}.slide h2{font:700 34px Georgia,serif}.slide li{margin:12px 0;font-size:20px}.week{border-left:3px solid #2457ff;padding:4px 0 10px 14px;margin:8px 0}.muted{color:#5b6b82}.err{color:#a31e27}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:650;margin:12px 0 5px}input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid #d5dde8;border-radius:8px;color:#14213d;background:#f8faff}textarea{min-height:80px;resize:vertical}.lit-card,.report{padding:16px;border:1px solid #d5dde8;border-radius:10px;margin:12px 0;background:#fbfcff}.teacher-reply{border-left:3px solid #2457ff;margin:12px 0;padding:8px 12px;background:#f1f5ff}.status{font-size:13px;color:#5b6b82}.message{min-height:22px;color:#2457ff}.table-note{font-size:13px;color:#5b6b82;margin:4px 0}.actions{display:flex;flex-wrap:wrap;gap:8px}.pill{display:inline-block;border-radius:20px;background:#e6ecff;color:#2457ff;padding:3px 10px;font-size:13px}
@media(max-width:650px){header{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.card{padding:18px}.slide{padding:28px}}
@media print{body{background:#fff}header{position:static;background:#fff;color:#111;padding:4px 0}.no-print{display:none!important}main{max-width:none;margin:0;padding:0}.card{border:0;border-radius:0;margin:0;break-inside:avoid}.slide{height:95vh;page-break-after:always;min-height:0;padding:9vh 8vw}.slide:last-child{page-break-after:auto}a{color:#111}body.print-slides #content>*:not(.slide){display:none!important}body.print-section #content>*:not(.print-target){display:none!important}}
</style></head><body><header><b>IdeaForge-X · Project workspace</b><div class="no-print actions"><button id="printAll">Save full workspace as PDF</button><button id="printLiterature">Save literature worksheet as PDF</button><button id="printData">Save data plan as PDF</button><button id="printSlides">Save review slides as PDF</button><a href="/" style="color:white;align-self:center">Back to project</a></div></header><main id="content"><section class="card">Loading approved project workspace…</section></main>
<script>
const esc=s=>{const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML};
const id=new URLSearchParams(location.search).get('id');let pack=null;
const send=async(url,body)=>{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not save.');return d};
const fields=(key,label,value,placeholder)=>'<label>'+esc(label)+'<textarea data-field="'+esc(key)+'" placeholder="'+esc(placeholder||'Write your notes here…')+'">'+esc(value||'')+'</textarea></label>';
function render(d){pack=d;document.title=esc(d.project.idea)+' · project workspace';const roadmap=d.roadmap.map(x=>'<div class="week"><b>Week '+esc(x.week)+': '+esc(x.title)+'</b><div>'+esc(x.deliverable)+'</div><div class="muted">Checkpoint: '+esc(x.checkpoint)+'</div></div>').join('');
const literature=d.workspace.literature.length?d.workspace.literature.map((p,i)=>'<article class="lit-card" data-literature="'+i+'" data-custom="'+(p.custom?'true':'false')+'">'+(p.custom?fields('title','Source title',p.title,'Enter the paper or dataset title')+fields('url','Source link',p.url,'Paste the https:// link'):('<b><a href="'+esc(p.url)+'" target="_blank" rel="noopener">'+esc(p.title)+'</a></b> <span class="muted">'+esc(p.year||'')+'</span>'))+'<p class="table-note">Read the original source first. Write this in your own words.</p>'+fields('problem','Problem studied',p.problem,'What problem are the authors trying to solve?')+fields('method','Method or data',p.method,'What method, model, or data did they use?')+fields('finding','Main finding',p.finding,'What did they find?')+fields('limitation','Limitations',p.limitation,'What is missing or limited?')+fields('relevance','How it relates to our project',p.relevance,'What can your project learn from it?')+'</article>').join(''):'<p class="muted">Add sources you find with your teacher, then write a short summary of each.</p>';
const ds=d.workspace.dataSheet||{};const dataFields=[['source','Data source','Where will the data come from?'],['permission','Permission and consent','Who owns it, and what permission is needed?'],['collection','How data will be collected','Explain the steps and tools.'],['variables','Fields / variables','List each field, its meaning, and its format.'],['sampleTarget','Sample size or target','How much data do you plan to collect?'],['privacy','Privacy and safety','How will you remove personal or sensitive details?'],['validation','Data checks','How will you check missing, wrong, or duplicate values?'],['limitations','Limits and possible bias','What might make this data incomplete or unfair?']].map(x=>fields(x[0],x[1],ds[x[0]],x[2])).join('');
const weekOptions=d.roadmap.map(w=>'<option value="'+esc(w.week)+'">Week '+esc(w.week)+': '+esc(w.title)+'</option>').join('');
const reports=(d.progressReports||[]).slice().sort((a,b)=>a.week-b.week||a.at-b.at).map(r=>'<article class="report"><span class="pill">Week '+esc(r.week)+'</span> <b>'+esc(r.author||'Student team')+'</b> <span class="status">'+esc(r.status||'Waiting for teacher')+' · '+new Date(r.at).toLocaleDateString()+'</span><p><b>Progress:</b> '+esc(r.summary)+'</p><p><b>Deliverable:</b> '+esc(r.deliverable||'Not entered')+'</p><p><b>Blockers:</b> '+esc(r.blockers||'None reported')+'</p><p><b>Next:</b> '+esc(r.next||'Not entered')+'</p>'+(r.evidence?'<p><a href="'+esc(r.evidence)+'" target="_blank" rel="noopener">Open evidence</a></p>':'')+(r.replies||[]).map(x=>'<div class="teacher-reply"><b>'+esc(x.teacher)+' · '+esc(x.status)+'</b><p>'+esc(x.message)+'</p><span class="status">'+new Date(x.at).toLocaleDateString()+'</span></div>').join('')+'</article>').join('')||'<p class="muted">No weekly updates yet. Send the first one after starting the approved project.</p>';
const feedback=d.teacherFeedback?'<div class="teacher-reply"><b>Teacher feedback on your worksheets · '+esc(d.workspaceFeedbackBy||'Teacher')+'</b><p>'+esc(d.teacherFeedback)+'</p></div>':'<p class="muted">Your teacher has not left feedback on these worksheets yet.</p>';
const slides=d.slides.map(s=>'<section class="card slide"><p class="muted">IdeaForge-X · Review presentation</p><h2>'+esc(s.title)+'</h2><ul>'+s.bullets.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></section>').join('');
document.getElementById('content').innerHTML='<section class="card"><p class="muted">APPROVED PROJECT · '+esc(d.project.className)+' · Approved '+new Date(d.project.approvedAt).toLocaleDateString()+'</p><h1>'+esc(d.project.idea)+'</h1><p>'+esc(d.project.tech)+'</p>'+(d.project.comment?'<p><b>Approval note:</b> '+esc(d.project.comment)+'</p>':'')+'<p class="pill">Team: '+esc(d.project.team||'Individual project')+'</p></section><section class="card"><h2>Your project roadmap</h2><p class="muted">Use this as a guide. Send one short progress report each week and ask your teacher when you get stuck.</p>'+roadmap+'</section><section class="card" id="weekly"><h2>Send a weekly progress report</h2><div class="grid"><label>Roadmap week<select id="week"><option value="">Choose a week</option>'+weekOptions+'</select></label>'+fields('summary','What did you work on?','','Describe the work in a few sentences.')+fields('deliverable','What did you finish?','','What can your teacher see or try?')+fields('blockers','What is difficult right now?','','Mention questions, delays, or resources you need.')+fields('next','What will you do next week?','','List the next small steps.')+fields('evidence','Evidence link (optional)','','GitHub, document, demo, or image link; add a public link only if safe to share.')+'</div><button class="primary" id="sendProgress">Send report to teacher</button><p class="message" id="progressMsg" role="status"></p></section><section class="card"><h2>Weekly conversation</h2><p class="muted">Your updates and your teacher’s replies stay together here.</p>'+reports+'</section><section class="card print-target" id="literature"><h2>Literature summary worksheet</h2><p class="muted">Summarize each source in your own words. Check the paper itself; the title alone is not enough.</p><div id="literatureList">'+literature+'</div><button type="button" id="addLiterature">+ Add a source</button><button class="primary" id="saveWorkspace">Save literature notes and data sheet</button><p class="message" id="workspaceMsg" role="status"></p></section><section class="card print-target" id="datasheet"><h2>Data sheet / dataset plan</h2><p class="muted">Describe the data before collecting it. Do not upload private or sensitive data to this workspace.</p><div class="grid">'+dataFields+'</div><button class="primary" id="saveDataSheet">Save data sheet</button><p class="message" id="dataSheetMsg" role="status"></p>'+feedback+'</section><section class="card"><h2>Literature starter links</h2>'+(d.literature.length?'<ol>'+d.literature.map(p=>'<li><a href="'+esc(p.url)+'" target="_blank" rel="noopener">'+esc(p.title)+'</a> '+esc(p.year||'')+(p.citations!=null?' · '+esc(p.citations)+' citations':'')+'</li>').join('')+'</ol>':'<p class="muted">No sources found yet. Add a source above or ask your teacher to help you search.</p>')+'</section><h1 class="no-print">Review presentation slides</h1>'+slides;
}
document.getElementById('content').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{
if(b.id==='sendProgress'){const card=b.closest('#weekly'),v=k=>card.querySelector('[data-field="'+k+'"]').value;const data={week:Number(document.getElementById('week').value),summary:v('summary'),deliverable:v('deliverable'),blockers:v('blockers'),next:v('next'),evidence:v('evidence')};await send('/api/my/submissions/'+encodeURIComponent(id)+'/progress',data);document.getElementById('progressMsg').textContent='Report sent. Your teacher can reply here.';setTimeout(()=>location.reload(),900)}
else if(b.id==='addLiterature'){const list=document.getElementById('literatureList'),idx=list.querySelectorAll('[data-literature]').length,article=document.createElement('article');article.className='lit-card';article.dataset.literature=idx;article.dataset.custom='true';article.innerHTML='<b>New source</b>'+fields('title','Source title','','Enter the paper or dataset title')+fields('url','Source link','','Paste the https:// link')+fields('problem','Problem studied','','What problem are the authors trying to solve?')+fields('method','Method or data','','What method, model, or data did they use?')+fields('finding','Main finding','','What did they find?')+fields('limitation','Limitations','','What is missing or limited?')+fields('relevance','How it relates to our project','','What can your project learn from it?');list.appendChild(article)}
else if(b.id==='saveWorkspace'||b.id==='saveDataSheet'){const literature=Array.from(document.querySelectorAll('[data-literature]')).map(el=>{const base=pack.workspace.literature[Number(el.dataset.literature)]||{},field=k=>el.querySelector('[data-field="'+k+'"]'),val=k=>field(k)?field(k).value:(base[k]||'');return{title:val('title')||base.title||'',url:val('url')||base.url||'',custom:el.dataset.custom==='true'||!!base.custom,problem:val('problem'),method:val('method'),finding:val('finding'),limitation:val('limitation'),relevance:val('relevance')}}).filter(n=>!n.custom||n.title||n.url);const dataSheet={};document.querySelectorAll('#datasheet [data-field]').forEach(el=>dataSheet[el.dataset.field]=el.value);await send('/api/my/submissions/'+encodeURIComponent(id)+'/workspace',{literature,dataSheet});document.getElementById(b.id==='saveDataSheet'?'dataSheetMsg':'workspaceMsg').textContent='Saved. Your teacher can review these worksheets in the project conversation.'}
}catch(err){const m=document.getElementById(b.id==='sendProgress'?'progressMsg':b.id==='saveDataSheet'?'dataSheetMsg':'workspaceMsg');if(m)m.textContent=err.message}});
document.getElementById('printAll').onclick=()=>window.print();document.getElementById('printLiterature').onclick=()=>printSection('literature');document.getElementById('printData').onclick=()=>printSection('datasheet');function printSection(id){const target=document.getElementById(id);if(!target)return;target.classList.add('print-target');document.body.classList.add('print-section');window.print();setTimeout(()=>document.body.classList.remove('print-section'),1000)}document.getElementById('printSlides').onclick=()=>{document.body.classList.add('print-slides');window.print();setTimeout(()=>document.body.classList.remove('print-slides'),1000)};
fetch('/api/my/submissions/'+encodeURIComponent(id||'')+'/artifacts').then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'Could not load project workspace.');return d}).then(render).catch(e=>document.getElementById('content').innerHTML='<section class="card err">'+esc(e.message)+'</section>');
</script></body></html>
